name: Build HONOR FUR-602/603 (ImmortalWrt 24.10)

# Builds an ImmortalWrt 24.10 (openwrt-24.10 branch, kernel 6.6) firmware for the
# HONOR FUR-602 / FUR-603 (MT7981B), targeting the hanwckf/bl-mt798x 20241115
# U-Boot with the expand(114m) NAND layout.
#
# Design notes
# ------------
# * The device is *injected* into the stock tree by diy-part2.sh rather than
#   living in a fork: DTS -> target/linux/mediatek/dts/, device definition ->
#   target/linux/mediatek/image/filogic.mk.  diy-part2.sh fails loudly if the
#   assumptions it depends on no longer hold.
# * The pre-build check step below fails the job early if the device did not
#   make it into the config, instead of after two hours of compiling.
# * The post-build verify step asserts the actual deliverables exist (factory +
#   sysupgrade images, the right DTBs, the expected kmod set) and prints a build
#   summary.
# * CONFIG_ALL_KMODS=y comes from .config: it builds + publishes the complete,
#   ABI-matched kmod set (tc/qdisc/CAKE/IFB, netfilter, mac80211/mt76, USB, ...)
#   so those can be `opkg install`ed later, while the image itself still only
#   contains DEFAULT_PACKAGES + DEVICE_PACKAGES.

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'ImmortalWrt source URL'
        required: true
        default: 'https://github.com/immortalwrt/immortalwrt'
      repo_branch:
        description: 'Source branch (must stay on 24.10 / kernel 6.6)'
        required: true
        default: 'openwrt-24.10'
      build_all_kmods:
        description: 'Publish the full kmod set (CONFIG_ALL_KMODS=y). Turn off only for a quick boot-only test build.'
        type: boolean
        required: true
        default: true
  push:
    branches: [ main ]
    paths:
      - '.config'
      - 'diy-part2.sh'
      - 'filogic.mk.append'
      - 'filogic.config.append'
      - 'mt7981b-honor-fur-602.dts'
      - '.github/workflows/build-fur602.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/immortalwrt/immortalwrt' }}
  REPO_BRANCH: ${{ github.event.inputs.repo_branch || 'openwrt-24.10' }}
  TARGET: mediatek
  SUBTARGET: filogic
  DEVICE: honor_fur-602
  # Must match DEVICE_DTS in filogic.mk.append
  DTS_NAME: mt7981b-honor-fur-602

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync unzip zlib1g-dev file wget curl subversion patch swig libelf-dev \
            libncursesw5-dev zstd

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "IMM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMM_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # Guard rails: the whole device definition assumes a 24.10-era tree.
      - name: Verify source tree matches our assumptions
        working-directory: openwrt
        run: |
          set -eu
          KV=$(sed -n 's/^KERNEL_PATCHVER:=//p' target/linux/mediatek/Makefile)
          echo "KERNEL_PATCHVER=$KV"
          if [ "$KV" != "6.6" ]; then
            echo "::error::expected kernel 6.6 on openwrt-24.10, got '$KV'."
            echo "::error::This repository is pinned to the 24.10 / 6.6 design. Refusing to build."
            exit 1
          fi

          test -f target/linux/mediatek/image/filogic.mk
          test -f target/linux/mediatek/image/Makefile
          test -d target/linux/mediatek/dts
          test -f target/linux/mediatek/filogic/config-6.6

          # Device/Default must still synthesise the FIT kernel we rely on.
          # Doubled dollars on purpose: in a Makefile `$$(x)` is a literal $(x).
          grep -q 'fit lzma \$\$(KDIR)/image-\$\$(firstword \$\$(DEVICE_DTS)).dtb' \
            target/linux/mediatek/image/Makefile

          # The upgrade path must still be the generic nand_do_upgrade fallback:
          # nand_do_platform_check() (package/base-files .../nand.sh) detects our
          # sysupgrade tar via sysupgrade-<board>/CONTROL and then untars it.
          PF=target/linux/mediatek/filogic/base-files/lib/upgrade/platform.sh
          grep -q 'nand_do_upgrade "\$1"' "$PF"
          if grep -q 'honor,fur-602' "$PF"; then
            echo "::error::$PF now special-cases honor,fur-602; re-verify the upgrade path"
            exit 1
          fi

          # mediatek has no per-target config, so filogic/config-6.6 is the
          # highest-priority kernel config -- our fragment belongs there.
          test ! -f target/linux/mediatek/config-6.6

          echo "source tree OK"

      - name: Inject HONOR FUR-602/603 device support
        run: |
          set -eu
          # diy-part2.sh runs with CWD=openwrt/ and reads the device files from
          # "../", i.e. this repository root -- which is where they already are.
          cp -f .config openwrt/.config
          cp -f diy-part2.sh openwrt/diy-part2.sh

          # CONFIG_ALL_KMODS=y publishes the complete, ABI-matched kmod set
          # (tc/qdisc/CAKE/IFB, netfilter, mac80211/mt76, USB, ...) so they can
          # be `opkg install`ed later, without adding them to the image.  Allow
          # a deliberate opt-out for a quick boot-only test build.
          if [ "${{ github.event.inputs.build_all_kmods || 'true' }}" = "false" ]; then
            echo "NOTE: build_all_kmods=false -- dropping CONFIG_ALL_KMODS=y"
            sed -i '/^CONFIG_ALL_KMODS=y$/d' openwrt/.config
          fi
          echo "--- build .config ---"
          cat openwrt/.config

          cd openwrt
          chmod +x diy-part2.sh
          ./diy-part2.sh

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # Keep the DTS in the tree even if the device definition is ever rebuilt.
      - name: Re-assert DTS once feeds are installed
        working-directory: openwrt
        run: |
          set -eu
          test -f "target/linux/mediatek/dts/$DTS_NAME.dts" || {
            echo "::error::DTS target/linux/mediatek/dts/$DTS_NAME.dts disappeared"
            exit 1
          }

      - name: Generate .config
        working-directory: openwrt
        run: make defconfig

      # ---------------------------------------------------------------- #
      # Fail fast: if the device is not in the config there is no point
      # compiling for two hours and finding out at the end.
      # ---------------------------------------------------------------- #
      - name: Pre-build check -- device and required config present
        working-directory: openwrt
        run: |
          set -eu
          echo "===== target / device selection ====="
          grep -E '^CONFIG_TARGET_mediatek(_filogic)?=' .config || true
          if ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602=' .config; then
            echo "::error::CONFIG_TARGET_mediatek_filogic_DEVICE_honor_fur-602 is not set."
            echo "::error::The device definition did not register -- check filogic.mk injection."
            exit 1
          fi

          echo "===== kmod publishing (so these are installable later) ====="
          if [ "${{ github.event.inputs.build_all_kmods || 'true' }}" = "false" ]; then
            echo "  (skipped: build_all_kmods=false)"
          else
            if ! grep -q '^CONFIG_ALL_KMODS=y' .config; then
              echo "::error::CONFIG_ALL_KMODS=y missing: the full kmod set (tc/qdisc/CAKE/IFB,"
              echo "::error::netfilter, mac80211/mt76, USB, ...) would not be published, and a"
              echo "::error::later 'opkg install kmod-sched-cake' would fail."
              exit 1
            fi
            echo "  CONFIG_ALL_KMODS=y present"
          fi

          echo "===== required wireless kmods selected by the device ====="
          # These come from DEVICE_PACKAGES in our filogic.mk entry; they must be
          # selected as =y in .config (installed into the image, not just built).
          for p in kmod-mt7915e kmod-mt7981-firmware mt7981-wo-firmware; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  OK   $p"
            else
              echo "::error::$p is not selected in .config; the device would have no working WiFi / offload firmware"
              exit 1
            fi
          done

          echo "===== QoE/QoS relevant kmod packages exist in the tree ====="
          for kp in sched-core sched sched-cake sched-prio sched-fq-pie ifb; do
            grep -q "define KernelPackage/$kp\$" package/kernel/linux/modules/netsupport.mk \
              || grep -q "define KernelPackage/$kp\$" package/kernel/linux/modules/netdevices.mk \
              || { echo "::error::KernelPackage/$kp definition not found"; exit 1; }
          done

          echo "pre-build check passed"

      - name: Download packages
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) || make -j1 V=s

      # ---------------------------------------------------------------- #
      # Post-build verification.  Asserts the actual deliverables exist
      # and prints the build summary.
      # ---------------------------------------------------------------- #
      - name: Verify images and kmod packages
        id: verify
        working-directory: openwrt
        run: |
          set -eu
          BIN="bin/targets/$TARGET/$SUBTARGET"
          test -d "$BIN" || { echo "::error::$BIN missing"; exit 1; }

          echo "===== firmware images ====="
          ls -la "$BIN"/*.bin "$BIN"/*.itb "$BIN"/kernel 2>/dev/null || true

          FACTORY=$(ls "$BIN"/*"$DEVICE"*factory*.bin 2>/dev/null | head -1 || true)
          SYSUP=$(ls "$BIN"/*"$DEVICE"*sysupgrade*.bin 2>/dev/null | head -1 || true)

          [ -n "$FACTORY" ] || { echo "::error::factory.bin not produced for $DEVICE"; exit 1; }
          [ -n "$SYSUP" ]   || { echo "::error::sysupgrade.bin not produced for $DEVICE"; exit 1; }

          echo "factory.bin    = $FACTORY ($(stat -c%s "$FACTORY") bytes)"
          echo "sysupgrade.bin = $SYSUP ($(stat -c%s "$SYSUP") bytes)"

          # sysupgrade.bin is produced by Build/sysupgrade-tar (scripts/
          # sysupgrade-tar.sh) then append-metadata.  Its payload must be a tar
          # containing sysupgrade-<DEVICE_NAME>/CONTROL, /kernel and /root,
          # because that is exactly what the bl-mt798x U-Boot's
          # parse_tar_image()/write_ubi2_tar_image() and OpenWrt's own
          # nand_do_platform_check() both look for.
          #
          # append-metadata may prepend/prepend a metadata header, so search for
          # the tar rather than assuming offset 0.
          if head -c 265 "$SYSUP" | tail -c 8 | grep -q ustar; then
            TAR="$SYSUP"
          elif [ -f "$BIN/kernel" ]; then
            TAR="$SYSUP"   # still check contents below
          fi

          echo "--- sysupgrade.bin payload ---"
          if tar tf "$SYSUP" >/dev/null 2>&1; then
            tar tf "$SYSUP" | head -10
            tar tf "$SYSUP" | grep -q "^sysupgrade-$DEVICE/" \
              || { echo "::error::sysupgrade.bin has no sysupgrade-$DEVICE/ dir"; exit 1; }
            tar tf "$SYSUP" | grep -q "^sysupgrade-$DEVICE/kernel$" \
              || echo "::warning::no sysupgrade-$DEVICE/kernel entry"
            tar tf "$SYSUP" | grep -q "^sysupgrade-$DEVICE/root$" \
              || echo "::warning::no sysupgrade-$DEVICE/root entry"
            echo "sysupgrade.bin: tar structure OK (kernel + root present)"
          else
            echo "::error::sysupgrade.bin is not a readable tar; bl-mt798x U-Boot cannot parse it"
            exit 1
          fi

          echo "===== manifest / profiles ====="
          ls -la "$BIN"/*.manifest 2>/dev/null || echo "(no manifest)"
          grep -q 'honor,fur-602' "$BIN/profiles.json" \
            || echo "::warning::honor,fur-602 not found in profiles.json"

          echo "===== DTB present? ====="
          ls "$BIN"/kernel 2>/dev/null || true
          ls "$BIN"/*.dtb 2>/dev/null || true

          echo "===== published kmod packages (QoS/SQM relevant) ====="
          PKGDIR="bin/targets/$TARGET/$SUBTARGET/packages"
          if [ -d "$PKGDIR" ]; then
            for p in kmod-sched-core kmod-sched kmod-sched-cake kmod-ifb \
                     kmod-mac80211 kmod-cfg80211 kmod-mt7915e kmod-nft-core kmod-pppoe; do
              if ls "$PKGDIR"/${p}_*.ipk >/dev/null 2>&1; then
                echo "  OK   $p"
              else
                echo "  MISS $p"
              fi
            done
          else
            echo "::warning::$PKGDIR not found; kmods are not published with this image set"
          fi

          echo "factory=$FACTORY" >> "$GITHUB_OUTPUT"
          echo "sysupgrade=$SYSUP" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        working-directory: openwrt
        run: |
          {
            echo "## HONOR FUR-602/603 build summary"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| source | $REPO_URL |"
            echo "| branch | $REPO_BRANCH |"
            echo "| commit | ${IMM_COMMIT:-unknown} |"
            echo "| kernel | 6.6 |"
            echo "| target | $TARGET |"
            echo "| subtarget | $SUBTARGET |"
            echo "| device | $DEVICE |"
            echo "| DTS | $DTS_NAME.dts -> DTB \`image-$DTS_NAME.dtb\` |"
            echo "| images | factory.bin (UBI, first flash) + sysupgrade.bin (tar, upgrades) |"
            echo "| U-Boot | hanwckf/bl-mt798x 20241115, expand(114m) layout |"
            echo ""
            echo "### firmware images"
            echo '```'
            ls -la "bin/targets/$TARGET/$SUBTARGET"/*.bin 2>/dev/null || echo "(none)"
            echo '```'
            echo "### key kernel config (from the built kernel)"
            echo '```'
            KCFG=$(find build_dir -name '.config' -path '*linux*' | head -1)
            if [ -n "${KCFG:-}" ]; then
              grep -E 'CONFIG_(NET_SCH_HTB|NET_SCH_CAKE|NET_SCH_FQ_CODEL|IFB|NET_ACT_MIRRED|NET_CLS_U32|MAC80211|CFG80211|BRIDGE|VLAN_8021Q|NET_DSA_MT7530)=' "$KCFG" || true
            else
              echo "(kernel .config not found)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        run: |
          mkdir -p out
          BIN="openwrt/bin/targets/$TARGET/$SUBTARGET"
          # firmware images
          find "$BIN" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' -o -name '*.tar' -o -name '*.manifest' -o -name 'profiles.json' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          # kernel image + DTB
          [ -f "$BIN/kernel" ] && cp "$BIN/kernel" out/ || true
          find "$BIN" -maxdepth 1 -name '*.dtb' -exec cp {} out/ \; 2>/dev/null || true
          # published kmod packages (so they can be side-loaded without a rebuild)
          if [ -d "$BIN/packages" ]; then
            mkdir -p out/packages
            cp "$BIN"/packages/*.ipk out/packages/ 2>/dev/null || true
            cp "$BIN"/packages/Packages* out/packages/ 2>/dev/null || true
          fi
          ls -la out/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-fur602-firmware-${{ env.IMM_COMMIT_SHORT }}
          path: out/
          retention-days: 14
          if-no-files-found: error
