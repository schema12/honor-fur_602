# ============================================================================
#  ImmortalWrt 25.12.2  --  package feed lock
# ============================================================================
#  Shell-sourceable.  These are NOT guessed: the release commit
#  4fc16f2985a358bd43bb522e43f05395fcbd6ed5 rewrote feeds.conf.default to pin
#  every feed to an exact 40-hex commit using OpenWrt's `^<sha>` syntax, i.e.
#
#     src-git packages https://github.com/immortalwrt/packages.git^84bd863...
#
#  so the pins below are exactly what upstream ships for 25.12.2.  The workflow
#  still re-verifies each feed's real `git rev-parse HEAD` after
#  `scripts/feeds update -a` and fails on any mismatch.
# ----------------------------------------------------------------------------

# name            url                                              pinned sha
FEED_packages_URL="https://github.com/immortalwrt/packages.git"
FEED_packages_SHA="84bd86384928955b568988ca0e09e2c78c75173d"

FEED_luci_URL="https://github.com/immortalwrt/luci.git"
FEED_luci_SHA="d6167ea0645cbd1327708d85f94824f42d0eb872"

FEED_routing_URL="https://github.com/openwrt/routing.git"
FEED_routing_SHA="e49d76035aafb85ddc993b59271d8c7ba56b5362"

FEED_telephony_URL="https://github.com/openwrt/telephony.git"
FEED_telephony_SHA="2618106d5846a4a542fdf5809f0d3ed228ce439b"

FEED_video_URL="https://github.com/openwrt/video.git"
FEED_video_SHA="094bf58da6682f895255a35a84349a79dab4bf95"

# The five feed names, in the order they appear in feeds.conf.default.
FEED_NAMES="packages luci routing telephony video"

# ----------------------------------------------------------------------------
#  Reproducibility boundary -- read this before claiming full reproducibility
# ----------------------------------------------------------------------------
#  LOCKED and verified:
#    * main source commit (REPO_SHA)
#    * all 5 feeds enabled by feeds.conf.default, to exact commits
#    * kernel patch version (6.12) and point release (6.12.103)
#
#  NOT locked / NOT fully reproducible:
#    * `make download` fetches per-package upstream tarballs.  Each package
#      Makefile pins PKG_HASH, so the *content* is verified, but some packages
#      track a moving upstream tag and can legitimately fail later if the
#      upstream host removes an old tarball.  This is inherent to OpenWrt and
#      is not fixable from this repository.
#    * The toolchain is built from the same locked tree, so it is reproducible
#      modulo host compiler/glibc differences on the runner image.
#    * `ubuntu-22.04` runner image contents are not pinned by this repository.
#
#  Conclusion: source + feeds are exactly reproducible; the full binary build
#  is reproducible up to upstream tarball availability and runner image drift.
#  We do NOT claim bit-for-bit reproducible firmware.
# ----------------------------------------------------------------------------
