#     marker is the git tag.
#
#  2. `v25.12.2` exists as an ANNOTATED, PGP-SIGNED tag:
#         tag object : bfc8bae082b913eb60e3247bb3e3a9cb3a6fde55
#         type       : tag (not commit)
#         tag        : v25.12.2
#         tagger     : Tianling Shen <cnsztl@immortalwrt.org>
#         tag date   : 2026-09-06T14:02:15Z
#         message    : "ImmortalWrt v25.12.2 Release"
#         signature  : verified, valid
#         object     : commit 4fc16f2985a358bd43bb522e43f05395fcbd6ed5
#
#  3. That commit's own message is "ImmortalWrt v25.12.2: adjust config
#     defaults", and it performs exactly the release-engineering edits:
#         include/version.mk  25.12-SNAPSHOT -> 25.12.2
#                             code -> r38135-0c4cd0f9920a
#                             repo -> .../releases/25.12.2
#         feeds.conf.default  branch refs -> exact commit pins (see feeds lock)
#         package/base-files/image-config.in  release repo default
#         version, version.date               (new files)
#
#  4. Therefore building from commit 4fc16f298... reproduces the 25.12.2
#     release baseline and yields firmware reporting 25.12.2 /
#     r38135-0c4cd0f9920a.
#
#  IMPORTANT -- the branch head is NOT 25.12.2:
#     refs/heads/openwrt-25.12 = ce35a9e4ef1b87fbbc2146036ce6693e4242861a
#     (dated 2026-10-09, "Merge Official Source")
#  That is *ahead* of the release tag.  Building the branch head would give a
#  moving 25.12-SNAPSHOT, not 25.12.2.  This lock exists precisely to prevent
#  that drift.
